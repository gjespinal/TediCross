telegram:
  token: "env"  # Se usa `env` para que lea la variable de entorno de Railway
  useFirstNameInsteadOfUsername: false
  colonAfterSenderName: false
  skipOldMessages: true
  sendEmojiWithStickers: true
  useCustomEmojiFilter: false
  replaceAtWithHash: false
  replaceExcessiveSpaces: false
  removeNewlineSpaces: false
  suppressFileTooBigMessages: false
  suppressThisIsPrivateBotMessage: false

discord:
  token: "env"  # Se usa `env` para leer la variable en Railway
  useNickname: false
  skipOldMessages: true
  replyLength: 100
  maxReplyLines: 2
  suppressThisIsPrivateBotMessage: false
  enableCustomStatus: false
  customStatusMessage: "TediCross"

bridges:
  - name: "Noticias"
    direction: both  # Puede ser "both", "tgToDc" o "dcToTg"
    threadMap:  # 🔹 Se usa `threadMap` para especificar el tópico exacto
      - name: "Noticias"
        telegram: 86  # ✅ ID del tópico en Telegram
        discord: '1332314270318460969'  # ✅ ID del canal en Discord (debe ir entre comillas)
    telegram:
      chatId: "-1002479265586"  # ✅ ID del grupo de Telegram (debe incluir el `-`)
      threadId: 86  # ✅ ID del tópico "Noticias"
      relayJoinMessages: false
      relayLeaveMessages: false
      sendUsernames: true
      crossDeleteOnDiscord: false
    discord:
      channelId: '1332314270318460969'  # ✅ Debe estar en comillas
      relayJoinMessages: false
      relayLeaveMessages: false
      sendUsernames: true
      crossDeleteOnTelegram: false
      disableWebPreviewOnTelegram: false
      useEmbeds: "auto"

debug: true  # Activa logs para verificar si el `threadMap` funciona
messageTimeoutAmount: 24
messageTimeoutUnit: 'hours'
persistentMessageMap: false

